# Copy to .github/workflows/upattest.yml in the repository that needs human review.
name: Human review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: upattest/review-action@v1
        with:
          api-key: ${{ secrets.UPATTEST_API_KEY }}
          paths: |
            infra/**
            auth/**
            *.sql
          max-price: 250
